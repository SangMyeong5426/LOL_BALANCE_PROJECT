<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="24" font-size="13" fill="#6e7781">같은 크기로 버프해도 프로 경기에는 한쪽만 닿는다</text><line x1="390" y1="34" x2="390" y2="278" stroke="#d8dee4"/><text x="40" y="42" font-size="15" font-weight="600" fill="#24292f">솔랭 승률</text><text x="40" y="62" font-size="12" fill="#6e7781">대조군을 뺀 뒤, %p</text><line x1="40" y1="250" x2="340" y2="250" stroke="#d8dee4" stroke-width="1.5"/><rect x="72" y="141" width="76" height="109" rx="3" fill="#8c959f"/><text x="110" y="131" font-size="16" font-weight="700" fill="#8c959f" text-anchor="middle">+0.73%p</text><text x="110" y="272" font-size="13" fill="#24292f" text-anchor="middle">프로 단골 (n=85)</text><rect x="222" y="139" width="76" height="111" rx="3" fill="#8c959f"/><text x="260" y="129" font-size="16" font-weight="700" fill="#8c959f" text-anchor="middle">+0.75%p</text><text x="260" y="272" font-size="13" fill="#24292f" text-anchor="middle">그 외 (n=214)</text><text x="420" y="42" font-size="15" font-weight="600" fill="#24292f">프로 경기 픽·밴율</text><text x="420" y="62" font-size="12" fill="#6e7781">자기 값 대비 비율, 중앙값</text><line x1="420" y1="250" x2="720" y2="250" stroke="#d8dee4" stroke-width="1.5"/><rect x="452" y="139" width="76" height="111" rx="3" fill="#cf222e"/><text x="490" y="129" font-size="16" font-weight="700" fill="#cf222e" text-anchor="middle">+35%</text><text x="490" y="272" font-size="13" fill="#24292f" text-anchor="middle">프로 단골</text><rect x="602" y="248" width="76" height="2" rx="3" fill="#8c959f"/><text x="640" y="238" font-size="16" font-weight="700" fill="#8c959f" text-anchor="middle">+0%</text><text x="640" y="272" font-size="13" fill="#24292f" text-anchor="middle">그 외</text><text x="40" y="308" font-size="12" fill="#6e7781">버프 299건 · 프로 단골은 평생 평균 픽·밴율 0.182 이상 · ./scripts/run-effect</text></svg>
