# 배포 페이지. **정적 파일 둘만 올린다** — 서버도 런타임 의존도 없다.
#
# `docs/site/data.json` 은 로컬에서 `./scripts/make-site` 로 만들어 커밋한다.
# CI 에는 `data/` 가 없어 여기서 다시 만들 수 없다.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/site/**", "docs/img/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `enablement` 이 없으면 저장소에 Pages 가 꺼져 있을 때 실패한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@v4
